# Windows and Workspaces : Keybinding and Rules

# See https://wiki.hyprland.org/Configuring/Keywords/

# Toggle decorations
bind = $mainMod, g, exec, ~/.config/hypr/toggle_deco.sh

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod Shift, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod Shift, End, exit,
bind = $mainMod Shift, Pause, exec, hyprlock

bind = $mainMod, b, exec, killall waybar || waybar

# TODO add $mainMod + End hotkey menu with options: lock, suspend, shutdown, reboot
# TODO add toggle visibility of status bar
# TODO add increase font size or zoom on status bar (and anyrunner

#bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle

bind = $mainMod, space, togglesplit, # dwindle

# Preselect where new window should go, like V/H split
bind = $mainMod Control, J, layoutmsg, preselect l
bind = $mainMod Control, code:47, layoutmsg, preselect r
bind = $mainMod Control, L, layoutmsg, preselect u
bind = $mainMod Control, K, layoutmsg, preselect d

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, j, movefocus, l
bind = $mainMod, k, movefocus, d
bind = $mainMod, l, movefocus, u
bind = $mainMod, code:47, movefocus, r

# Move focused window with mainMod Shift + arrow keys
bind = $mainMod Shift, left, movewindow, l
bind = $mainMod Shift, right, movewindow, r
bind = $mainMod Shift, up, movewindow, u
bind = $mainMod Shift, down, movewindow, d

bind = $mainMod Shift, j, movewindow, l
bind = $mainMod Shift, k, movewindow, d
bind = $mainMod Shift, l, movewindow, u
bind = $mainMod Shift, code:47, movewindow, r

bind = $mainMod Control, j, swapwindow, l
bind = $mainMod Control, k, swapwindow, d
bind = $mainMod Control, l, swapwindow, u
bind = $mainMod Control, code:47, swapwindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to extra workspaces [11-20]
bind = $mainMod Control, 1, workspace, 11
bind = $mainMod Control, 2, workspace, 12
bind = $mainMod Control, 3, workspace, 13
bind = $mainMod Control, 4, workspace, 14
bind = $mainMod Control, 5, workspace, 15
bind = $mainMod Control, 6, workspace, 16
bind = $mainMod Control, 7, workspace, 17
bind = $mainMod Control, 8, workspace, 18
bind = $mainMod Control, 9, workspace, 19
bind = $mainMod Control, 0, workspace, 20

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Move to extra workspaces [11-20]
bind = $mainMod Control SHIFT, 1, movetoworkspacesilent, 11
bind = $mainMod Control SHIFT, 2, movetoworkspacesilent, 12
bind = $mainMod Control SHIFT, 3, movetoworkspacesilent, 13
bind = $mainMod Control SHIFT, 4, movetoworkspacesilent, 14
bind = $mainMod Control SHIFT, 5, movetoworkspacesilent, 15
bind = $mainMod Control SHIFT, 6, movetoworkspacesilent, 16
bind = $mainMod Control SHIFT, 7, movetoworkspacesilent, 17
bind = $mainMod Control SHIFT, 8, movetoworkspacesilent, 18
bind = $mainMod Control SHIFT, 9, movetoworkspacesilent, 19
bind = $mainMod Control SHIFT, 0, movetoworkspacesilent, 20

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Relative "Scroll" through workspaces
binde = $mainMod Alt, semicolon, workspace, e+1
#binde = $mainMod Alt, l, workspace, e+1
binde = $mainMod Alt, j, workspace, e-1
#binde = $mainMod Alt, k, workspace, e-1

# Resize windows with i3wm-like submap mainMod+Shift R
bind = $mainMod, R, submap, resize
submap=resize
	binde = Alt, right, resizeactive, 10 0
	binde = Alt, left, resizeactive, -10 0
	binde = Alt, up, resizeactive, 0 -10
	binde = Alt, down, resizeactive, 0 10
	binde = Alt, code:47, resizeactive, 10 0
	binde = Alt, j, resizeactive, -10 0
	binde = Alt, l, resizeactive, 0 -10
	binde = Alt, k, resizeactive, 0 10

	binde = , right, resizeactive, 50 0
	binde = , left, resizeactive, -50 0
	binde = , up, resizeactive, 0 -50
	binde = , down, resizeactive, 0 50
	binde = , code:47, resizeactive, 50 0
	binde = , j, resizeactive, -50 0
	binde = , l, resizeactive, 0 -50
	binde = , k, resizeactive, 0 50

	binde = Shift, right, resizeactive, 200 0
	binde = Shift, left, resizeactive, -200 0
	binde = Shift, up, resizeactive, 0 -200
	binde = Shift, down, resizeactive, 0 200
	binde = Shift, code:47, resizeactive, 200 0
	binde = Shift, j, resizeactive, -200 0
	binde = Shift, l, resizeactive, 0 -200
	binde = Shift, k, resizeactive, 0 200

	binde = Control, right, resizeactive, 400 0
	binde = Control, left, resizeactive, -400 0
	binde = Control, up, resizeactive, 0 -400
	binde = Control, down, resizeactive, 0 400
	binde = Control, code:47, resizeactive, 400 0
	binde = Control, j, resizeactive, -400 0
	binde = Control, l, resizeactive, 0 -400
	binde = Control, k, resizeactive, 0 400

	bind = $mainMod, R, submap, reset
	bind = , Escape, submap, reset
submap=reset

# Move active floating window
binde = $mainMod Alt, right, moveactive, 10 0
binde = $mainMod Alt, left, moveactive, -10 0
binde = $mainMod Alt, up, moveactive, 0 -10
binde = $mainMod Alt, down, moveactive, 0 10
binde = $mainMod Alt, code:47, moveactive, 10 0
binde = $mainMod Alt, j, moveactive, -10 0
binde = $mainMod Alt, l, moveactive, 0 -10
binde = $mainMod Alt, k, moveactive, 0 10

binde = $mainMod , right, moveactive, 50 0
binde = $mainMod , left, moveactive, -50 0
binde = $mainMod , up, moveactive, 0 -50
binde = $mainMod , down, moveactive, 0 50
binde = $mainMod , code:47, moveactive, 50 0
binde = $mainMod , j, moveactive, -50 0
binde = $mainMod , l, moveactive, 0 -50
binde = $mainMod , k, moveactive, 0 50

binde = $mainMod Shift, right, moveactive, 200 0
binde = $mainMod Shift, left, moveactive, -200 0
binde = $mainMod Shift, up, moveactive, 0 -200
binde = $mainMod Shift, down, moveactive, 0 200
binde = $mainMod Shift, code:47, moveactive, 200 0
binde = $mainMod Shift, j, moveactive, -200 0
binde = $mainMod Shift, l, moveactive, 0 -200
binde = $mainMod Shift, k, moveactive, 0 200

binde = $mainMod Control, right, moveactive, 400 0
binde = $mainMod Control, left, moveactive, -400 0
binde = $mainMod Control, up, moveactive, 0 -400
binde = $mainMod Control, down, moveactive, 0 400
binde = $mainMod Control, code:47, moveactive, 400 0
binde = $mainMod Control, j, moveactive, -400 0
binde = $mainMod Control, l, moveactive, 0 -400
binde = $mainMod Control, k, moveactive, 0 400

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# Save/Load Layout
bind = $mainMod Control, h, exec, $HOME/.config/hypr/save_layout
bind = $mainMod Shift, h, exec, $HOME/.config/hypr/load_layout
bind = $mainMod Shift Alt, h, exec, $HOME/.config/hypr/load_layout --layout_existing

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
