# Audio

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Keyboard audio controls
# Mute Source (mic)
bindl = $mainMod Control, period, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Push-to-talk mic
bindl = $mainMod, slash, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 0
bindlr = $mainMod, slash, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 1
# Right Alt for push-to-talk
bindli = , 108, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 0
bindlri = , 108, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 1

# Mute Sink (output)
bindl = $mainMod Control, comma, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Volume Increment / Decrement
bindel = $mainMod, period, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mainMod, comma, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = $mainMod Shift, period, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+
bindel = $mainMod Shift, comma, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindel = $mainMod Alt, period, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = $mainMod Alt, comma, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
